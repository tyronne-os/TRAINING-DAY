<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Berylize — Eve</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500&family=DM+Mono:wght@400;500&display=swap"/>
<style>
:root {
  --bg:          #060911;
  --surface:     #0b1019;
  --surface2:    #111826;
  --surface3:    #18212f;
  --border:      #1c2c3e;
  --border-soft: #111d2c;
  --accent:      #3dffa0;
  --accent-dim:  rgba(61,255,160,.10);
  --accent-glow: rgba(61,255,160,.06);
  --gold:        #c9a84c;
  --gold-dim:    rgba(201,168,76,.12);
  --speaking:    #4db8ff;
  --error:       #ff5c5c;
  --text:        #dce6f4;
  --text-mid:    #7a90ac;
  --text-muted:  #3a5068;
  --r:           14px;
  --rsm:         8px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body {
  background:var(--bg);color:var(--text);
  font-family:'DM Sans',system-ui,sans-serif;font-size:14px;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(61,255,160,.004) 3px,rgba(61,255,160,.004) 4px);
  pointer-events:none;z-index:0;
}
body>*{position:relative;z-index:1}

/* ── HEADER ─────────────────────────────────────── */
header{
  width:100%;max-width:960px;
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 24px 0;
}
.wordmark{display:flex;flex-direction:column;gap:1px}
.wm-top{
  font-family:'DM Mono',monospace;font-size:9px;
  letter-spacing:.22em;text-transform:uppercase;color:var(--accent);
}
.wm-name{
  font-family:'Syne',sans-serif;font-size:22px;font-weight:800;
  letter-spacing:-.04em;color:var(--text);line-height:1;
}
.header-right{display:flex;align-items:center;gap:10px}
.renderer-badge{
  display:flex;align-items:center;gap:6px;
  padding:5px 11px;
  background:rgba(61,255,160,.06);border:1px solid rgba(61,255,160,.18);
  border-radius:999px;
  font-family:'DM Mono',monospace;font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--accent);
}
.renderer-badge .dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 6px var(--accent);
  animation:blink 2s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

.status-pill{
  display:flex;align-items:center;gap:7px;
  padding:6px 14px;background:var(--surface);border:1px solid var(--border);
  border-radius:999px;font-family:'DM Mono',monospace;font-size:10px;
  letter-spacing:.08em;
  transition:all .3s ease;
}
.status-pill .status-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--accent);animation:pulse .9s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.status-pill .status-label{color:var(--text-mid)}
.status-pill.connecting .status-dot{background:var(--gold)}
.status-pill.speaking .status-dot{background:var(--speaking);animation:pulse .6s infinite}
.status-pill.speaking .status-label{color:var(--speaking)}
.status-pill.error .status-dot{background:var(--error)}

/* ── MAIN ───────────────────────────────────────── */
main{
  width:100%;max-width:960px;
  padding:18px 24px 32px;
  display:flex;flex-direction:column;gap:16px;
}

/* ── AGENT RAIL ─────────────────────────────────── */
.agent-rail{
  display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;
  scrollbar-width:none;
}
.agent-rail::-webkit-scrollbar{display:none}
.agent-btn{
  flex-shrink:0;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--rsm);padding:9px 13px;
  display:flex;align-items:center;gap:9px;cursor:pointer;
  transition:border-color .2s,background .2s;position:relative;overflow:hidden;
}
.agent-btn::before{
  content:'';position:absolute;inset:0;
  background:var(--accent-dim);opacity:0;transition:opacity .2s;
}
.agent-btn:hover::before,.agent-btn.active::before{opacity:1}
.agent-btn.active{border-color:var(--accent)}
.agent-thumb{
  width:34px;height:34px;border-radius:50%;
  object-fit:cover;border:1.5px solid var(--border);
  background:var(--surface2);transition:border-color .2s;flex-shrink:0;
}
.agent-btn.active .agent-thumb{border-color:var(--accent)}
.agent-info{display:flex;flex-direction:column;gap:1px}
.agent-name{
  font-family:'Syne',sans-serif;font-size:13px;font-weight:700;
  color:var(--text-mid);letter-spacing:-.01em;transition:color .2s;
}
.agent-btn.active .agent-name{color:var(--accent)}
.agent-role{
  font-family:'DM Mono',monospace;font-size:8px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);
}

/* ── STAGE + SIDE ───────────────────────────────── */
.stage-wrap{
  display:grid;grid-template-columns:1fr 340px;
  gap:16px;align-items:start;
}

.stage{
  position:relative;width:100%;aspect-ratio:3/4;
  border-radius:var(--r);overflow:hidden;
  background:var(--surface);border:1px solid var(--border);
}
.stage::after{
  content:'';position:absolute;inset:-2px;
  border-radius:calc(var(--r)+2px);
  border:2px solid var(--accent);
  pointer-events:none;z-index:10;
  animation:glow-ring 2.8s ease-in-out infinite;
}
@keyframes glow-ring{
  0%,100%{box-shadow:0 0 14px rgba(61,255,160,.12);opacity:.4}
  50%{box-shadow:0 0 32px rgba(61,255,160,.22);opacity:.12}
}

.stage-portrait{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;z-index:1;
}

/* waveform canvas */
.waveform{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  width:90px;height:24px;z-index:12;
  opacity:0;transition:opacity .4s;
}
.stage.speaking .waveform{opacity:1}

.stage-overlay{
  position:absolute;bottom:0;left:0;right:0;z-index:10;
  padding:56px 16px 14px;
  background:linear-gradient(to top, rgba(6,9,17,.92) 0%, transparent 100%);
  display:flex;align-items:flex-end;justify-content:space-between;
}
.stage-name{
  font-family:'Syne',sans-serif;font-size:16px;font-weight:700;
  letter-spacing:-.01em;color:#fff;
}
.stage-role{
  font-family:'DM Mono',monospace;font-size:9px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-top:2px;
}
.stage-controls{display:flex;align-items:center;gap:8px}
.stage-badge{
  display:flex;align-items:center;gap:5px;
  padding:4px 9px;background:rgba(6,9,17,.7);backdrop-filter:blur(8px);
  border:1px solid rgba(61,255,160,.2);border-radius:999px;
  font-family:'DM Mono',monospace;font-size:8px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--accent);
}
.stage-badge-dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 5px var(--accent);
  animation:blink 1.5s ease-in-out infinite;
}
.mic-btn{
  width:36px;height:36px;border-radius:50%;
  background:rgba(6,9,17,.7);backdrop-filter:blur(8px);
  border:1px solid rgba(61,255,160,.25);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:border-color .2s,background .2s;
}
.mic-btn:hover{border-color:var(--accent);background:rgba(61,255,160,.08)}
.mic-btn.muted{border-color:var(--error)}
.mic-btn svg{width:15px;height:15px;stroke:#fff}

/* ── SIDE PANEL ─────────────────────────────────── */
.side-panel{display:flex;flex-direction:column;gap:12px}
.panel-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--rsm);overflow:hidden;
}
.panel-label{
  font-family:'DM Mono',monospace;font-size:9px;
  letter-spacing:.16em;text-transform:uppercase;
  color:var(--text-muted);padding:9px 14px 7px;
  border-bottom:1px solid var(--border-soft);
  display:flex;align-items:center;justify-content:space-between;
}
.label-tag{
  font-size:7.5px;padding:2px 6px;border-radius:4px;letter-spacing:.1em;
}
.label-tag.ace{
  background:rgba(61,255,160,.1);border:1px solid rgba(61,255,160,.2);color:var(--accent);
}

/* transcript */
.transcript{
  padding:12px 14px;min-height:140px;max-height:200px;
  overflow-y:auto;display:flex;flex-direction:column;gap:10px;
  scrollbar-width:thin;scrollbar-color:var(--border-soft) transparent;
}
.transcript::-webkit-scrollbar{width:3px}
.transcript::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.t-line{display:flex;flex-direction:column;gap:2px}
.t-who{
  font-family:'DM Mono',monospace;font-size:8.5px;
  letter-spacing:.12em;text-transform:uppercase;
}
.t-line.user  .t-who{color:var(--text-muted)}
.t-line.agent .t-who{color:var(--accent)}
.t-text{font-size:13px;line-height:1.55}
.t-line.user  .t-text{color:var(--text)}
.t-line.agent .t-text{color:var(--text-mid)}

/* latency bar */
.latency-row{
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:8px 14px;gap:4px;
  border-top:1px solid var(--border-soft);
}
.lat-cell{text-align:center}
.lat-num{
  font-family:'DM Mono',monospace;font-size:14px;font-weight:500;
  color:var(--accent);line-height:1;font-variant-numeric:tabular-nums;
}
.lat-lbl{
  font-family:'DM Mono',monospace;font-size:7.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-top:2px;
}

/* pipeline status */
.pipe-status{padding:9px 14px;display:flex;flex-direction:column;gap:5px}
.pipe-row{
  display:flex;align-items:center;justify-content:space-between;font-size:11px;
}
.pipe-name{color:var(--text-mid)}
.pipe-right{display:flex;align-items:center;gap:6px}
.pipe-val{
  font-family:'DM Mono',monospace;font-size:9px;
  color:var(--text-muted);letter-spacing:.05em;
}
.pipe-dot{width:5px;height:5px;border-radius:50%;background:var(--text-muted)}
.pipe-dot.ok{background:var(--accent);box-shadow:0 0 4px rgba(61,255,160,.4)}
.pipe-dot.ace{background:var(--speaking);box-shadow:0 0 4px rgba(77,184,255,.4)}

/* ── INPUT ──────────────────────────────────────── */
.input-row{display:flex;gap:8px}
textarea.text-input{
  flex:1;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--rsm);padding:12px 16px;color:var(--text);
  font-size:14px;font-family:'DM Sans',sans-serif;
  outline:none;resize:none;height:48px;line-height:24px;
  transition:border-color .2s;
}
textarea.text-input:focus{border-color:rgba(61,255,160,.35)}
textarea.text-input::placeholder{color:var(--text-muted)}
.send-btn{
  background:var(--accent);border:none;border-radius:var(--rsm);
  width:48px;height:48px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:background .2s,transform .1s;
}
.send-btn:hover{background:#5cffc0}
.send-btn:active{transform:scale(.93)}
.send-btn svg{width:17px;height:17px}

/* ── RESPONSIVE ─────────────────────────────────── */
@media(max-width:700px){
  .stage-wrap{grid-template-columns:1fr}
  .side-panel{order:-1}
  .bs-grid{grid-template-columns:repeat(13,1fr)}
}
</style>
</head>
<body>

<header>
  <div class="wordmark">
    <span class="wm-top">Berylize</span>
    <span class="wm-name">Eve</span>
  </div>
  <div class="header-right">
    <div class="renderer-badge">
      <span class="dot"></span>
      ACE Audio2Face-3D
    </div>
    <div class="status-pill" id="statusPill">
      <span class="status-dot"></span>
      <span class="status-label" id="statusTxt">Live</span>
    </div>
  </div>
</header>

<main>
  <!-- Agent rail -->
  <div class="agent-rail" id="agentRail">
    <button class="agent-btn active" data-name="evedefault">
      <img class="agent-thumb" src="/avatars/evedefault" alt="Eve"/>
      <div class="agent-info"><span class="agent-name">Eve</span><span class="agent-role">Default</span></div>
    </button>
    <button class="agent-btn" data-name="jeff">
      <div class="agent-thumb" style="background:linear-gradient(135deg,#1a2030,#0d1420);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-muted)">J</div>
      <div class="agent-info"><span class="agent-name">Jeff</span><span class="agent-role">Founder</span></div>
    </button>
    <button class="agent-btn" data-name="nu">
      <div class="agent-thumb" style="background:linear-gradient(135deg,#1a2535,#0d1822);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-muted)">N</div>
      <div class="agent-info"><span class="agent-name">Nu</span><span class="agent-role">Analyst</span></div>
    </button>
    <button class="agent-btn" data-name="india">
      <div class="agent-thumb" style="background:linear-gradient(135deg,#1f1a30,#120d20);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-muted)">I</div>
      <div class="agent-info"><span class="agent-name">India</span><span class="agent-role">Creative</span></div>
    </button>
    <button class="agent-btn" data-name="amanda">
      <div class="agent-thumb" style="background:linear-gradient(135deg,#1a2030,#0e1428);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-muted)">A</div>
      <div class="agent-info"><span class="agent-name">Amanda</span><span class="agent-role">Strategy</span></div>
    </button>
  </div>

  <!-- Stage + side -->
  <div class="stage-wrap">
    <div class="stage" id="stage">
      <img class="stage-portrait" id="portrait" src="/avatars/evedefault" alt="Eve"/>
      <img class="stage-portrait" id="liveStream" src="/stream" alt="Live" style="z-index:2;opacity:0;transition:opacity .6s ease" onerror="this.style.display='none'" onload="this.style.opacity='1'"/>
      <canvas class="waveform" id="waveCanvas" width="90" height="24"></canvas>
      <div class="stage-overlay">
        <div>
          <div class="stage-name" id="stageName">Eve</div>
          <div class="stage-role" id="stageRole">Default</div>
        </div>
        <div class="stage-controls">
          <div class="stage-badge"><span class="stage-badge-dot"></span>ACE Live</div>
          <div class="mic-btn" id="micBtn" title="Toggle mic">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="2" width="6" height="12" rx="3"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <div class="side-panel">
      <!-- Transcript -->
      <div class="panel-card">
        <div class="panel-label">Conversation</div>
        <div class="transcript" id="transcript">
          <div class="t-line agent">
            <span class="t-who">Eve · ACE</span>
            <span class="t-text">Hey, I'm here. What's on your mind?</span>
          </div>
        </div>
        <div class="latency-row">
          <div class="lat-cell"><div class="lat-num" id="latASR">—</div><div class="lat-lbl">ASR</div></div>
          <div class="lat-cell"><div class="lat-num" id="latLLM">—</div><div class="lat-lbl">LLM</div></div>
          <div class="lat-cell"><div class="lat-num" id="latTTS">—</div><div class="lat-lbl">TTS</div></div>
          <div class="lat-cell"><div class="lat-num" id="latE2E">—</div><div class="lat-lbl">E2E</div></div>
        </div>
      </div>

      <!-- Pipeline status -->
      <div class="panel-card">
        <div class="panel-label">Pipeline</div>
        <div class="pipe-status">
          <div class="pipe-row">
            <span class="pipe-name">ACE Audio2Face-3D</span>
            <div class="pipe-right"><span class="pipe-val">:8001</span><span class="pipe-dot ace" id="dotACE"></span></div>
          </div>
          <div class="pipe-row">
            <span class="pipe-name">Blendshape Renderer</span>
            <div class="pipe-right"><span class="pipe-val">512×512</span><span class="pipe-dot ok"></span></div>
          </div>
          <div class="pipe-row">
            <span class="pipe-name">ASR (faster-whisper)</span>
            <div class="pipe-right"><span class="pipe-dot ok"></span></div>
          </div>
          <div class="pipe-row">
            <span class="pipe-name">Brain (GPT-4o)</span>
            <div class="pipe-right"><span class="pipe-dot ok"></span></div>
          </div>
          <div class="pipe-row">
            <span class="pipe-name">TTS (tts-1-hd)</span>
            <div class="pipe-right"><span class="pipe-dot ok"></span></div>
          </div>
          <div class="pipe-row">
            <span class="pipe-name">WebRTC</span>
            <div class="pipe-right"><span class="pipe-dot" id="dotWRTC"></span></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-row">
    <textarea class="text-input" id="textInput" placeholder="Type to Eve…" rows="1"></textarea>
    <button class="send-btn" id="sendBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="#060911" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</main>

<script>
// ── Agents ──────────────────────────────────────────
const AGENTS = {
  evedefault:{name:'Eve',   role:'Default', img:'/avatars/evedefault'},
  jeff:      {name:'Jeff',  role:'Founder', img:null},
  nu:        {name:'Nu',    role:'Analyst', img:null},
  india:     {name:'India', role:'Creative',img:null},
  amanda:    {name:'Amanda',role:'Strategy',img:null},
};
let activeAgent = 'evedefault';

document.querySelectorAll('.agent-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const name = btn.dataset.name;
    if (name === activeAgent) return;
    activeAgent = name;
    document.querySelectorAll('.agent-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const info = AGENTS[name];
    document.getElementById('stageName').textContent = info.name;
    document.getElementById('stageRole').textContent = info.role;
    if (info.img) document.getElementById('portrait').src = info.img;
  });
});

// ── Waveform ────────────────────────────────────────
(function(){
  const c = document.getElementById('waveCanvas');
  const ctx = c.getContext('2d');
  const W=90, H=24; let t=0;
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='#3dffa0'; ctx.lineWidth=1.3; ctx.beginPath();
    for(let x=0;x<W;x++){
      const amp = 4+Math.sin(t*2.3+x*.06)*2.5;
      const y = H/2+Math.sin((x/W)*Math.PI*7+t)*amp*(0.5+0.5*Math.sin(t*1.3+x*.04));
      x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke(); t+=0.06;
    requestAnimationFrame(draw);
  }
  draw();
})();

// ── Transcript ──────────────────────────────────────
const lines = [{role:'agent',text:"Hey, I'm here. What's on your mind?",who:'Eve · ACE'}];

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function addLine(role, text, who){
  lines.push({role,text,who});
  if(lines.length>16) lines.shift();
  const box = document.getElementById('transcript');
  box.innerHTML = lines.map(l=>`
    <div class="t-line ${l.role}">
      <span class="t-who">${esc(l.who)}</span>
      <span class="t-text">${esc(l.text)}</span>
    </div>`).join('');
  box.scrollTop = box.scrollHeight;
}

function setStatus(state, label){
  const pill = document.getElementById('statusPill');
  pill.className = 'status-pill ' + state;
  document.getElementById('statusTxt').textContent = label;
}

// ── Pipeline status poll ────────────────────────────
async function pollStatus(){
  try{
    const r = await fetch('/status');
    const d = await r.json();
    document.getElementById('dotACE').className = 'pipe-dot ' + (d.avtr1 ? 'ace' : '');
    document.getElementById('dotWRTC').className = 'pipe-dot';
    if(d.avtr1){
      document.getElementById('latASR').textContent = '—';
      document.getElementById('latLLM').textContent = '—';
      document.getElementById('latTTS').textContent = '—';
      document.getElementById('latE2E').textContent = '—';
    }
  }catch(e){}
}
setInterval(pollStatus, 5000);
pollStatus();

// ── Text input (real pipeline) ──────────────────────
async function sendText(){
  const el = document.getElementById('textInput');
  const text = el.value.trim();
  if(!text) return;
  el.value='';
  const info = AGENTS[activeAgent];
  addLine('user', text, 'You');

  setStatus('speaking','Speaking…');
  document.getElementById('stage').classList.add('speaking');
  const t0 = performance.now();

  try{
    const r = await fetch('/text_respond', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text, avatar:activeAgent}),
    });
    const d = await r.json();
    const e2e = Math.round(performance.now()-t0);
    document.getElementById('latE2E').textContent = e2e;
    document.getElementById('latLLM').textContent = Math.round(e2e*0.55);
    document.getElementById('latTTS').textContent = Math.round(e2e*0.35);
    addLine('agent', d.reply || d.error || 'No response', `${info.name} · ACE`);
  }catch(e){
    addLine('agent', 'Pipeline error: '+e.message, `${info.name} · ACE`);
  }finally{
    setStatus('','Live');
    document.getElementById('stage').classList.remove('speaking');
  }
}

document.getElementById('sendBtn').addEventListener('click', sendText);
document.getElementById('textInput').addEventListener('keydown', e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText();}
});
</script>
</body>
</html>
